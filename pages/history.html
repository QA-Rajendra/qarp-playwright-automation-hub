<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Execution History — Playwright Hub</title>
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          fontFamily: {
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    }
  </script>
  <!-- Custom Theme & Animations -->
  <link rel="stylesheet" href="../assets/css/custom.css">
</head>
<body class="w-full min-h-screen text-slate-100 font-mono select-none antialiased flex flex-col">

  <!-- Header -->
  <header class="flex items-center justify-between px-6 py-4 border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-30">
    <div class="flex items-center gap-3">
      <a href="../index.html" class="w-8 h-8 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 flex items-center justify-center text-sm transition-all" title="Back to Runner">
        ←
      </a>
      <div class="text-xs text-slate-400">
        Runner &nbsp;›&nbsp; <span class="text-purple-400 font-semibold">Execution Audit History</span>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <button type="button" class="text-xs px-3 py-1.5 rounded-lg border border-rose-900/60 bg-rose-950/30 hover:bg-rose-900/50 text-rose-300 font-mono transition-all flex items-center gap-1.5"
              onclick="historyCtrl.confirmClearHistory()">
        <span>🗑</span> Clear History
      </button>
      <button type="button" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full border border-slate-700 bg-slate-800 text-slate-300 text-[10px]"
              id="themeBtn" onclick="theme.toggleThemeMenu(event)">
        <span id="themeIco">🌙</span>
        <span id="themeLbl">CYBER</span>
      </button>
    </div>
  </header>

  <!-- Main History Canvas -->
  <main class="flex-1 max-w-5xl w-full mx-auto p-6 flex flex-col gap-5">

    <!-- Filter & Search Toolbar -->
    <div class="flex flex-col sm:flex-row gap-3 items-stretch sm:items-center justify-between p-4 rounded-2xl border border-slate-800 bg-slate-900/50 backdrop-blur-md">
      <!-- Status Filter Tabs -->
      <div class="flex items-center gap-1.5 p-1 rounded-xl bg-slate-950 border border-slate-800/80 text-xs">
        <button type="button" class="filter-btn px-3 py-1 rounded-lg transition-all font-semibold bg-violet-950/70 border border-violet-500 text-purple-300"
                data-status="all" onclick="historyCtrl.setFilter('all')">
          All
        </button>
        <button type="button" class="filter-btn px-3 py-1 rounded-lg transition-all text-slate-400 hover:text-emerald-300"
                data-status="passed" onclick="historyCtrl.setFilter('passed')">
          Passed
        </button>
        <button type="button" class="filter-btn px-3 py-1 rounded-lg transition-all text-slate-400 hover:text-rose-300"
                data-status="failed" onclick="historyCtrl.setFilter('failed')">
          Failed
        </button>
      </div>

      <!-- Search Input -->
      <div class="flex items-center gap-2 flex-1 sm:max-w-xs">
        <input type="text" id="historySearch" placeholder="🔍 Search past commands…"
               class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-1.5 text-xs text-slate-200 placeholder-slate-500 focus:outline-none focus:border-violet-500 font-mono">
      </div>

      <div class="text-[10px] text-slate-500 font-mono text-right sm:text-left self-center" id="historyCount">
        Loading…
      </div>
    </div>

    <!-- History Runs Cards Container -->
    <div class="flex flex-col gap-3" id="historyList"></div>

  </main>

  <!-- Clear History Confirmation Modal -->
  <div class="hidden fixed inset-0 z-50 items-center justify-center bg-black/70 backdrop-blur-sm" id="clearConfirmModal">
    <div class="w-full max-w-sm p-6 rounded-2xl bg-slate-900 border border-slate-800 shadow-2xl font-mono text-xs text-slate-200">
      <div class="flex items-center gap-3 text-rose-400 text-base font-bold mb-3">
        <span>⚠</span> Clear All History?
      </div>
      <p class="text-slate-400 leading-relaxed mb-6">
        This will permanently remove all test execution logs from this browser and the server. This action cannot be undone.
      </p>
      <div class="flex justify-end gap-2">
        <button type="button" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300"
                onclick="UI.closeModal('clearConfirmModal')">
          Cancel
        </button>
        <button type="button" class="px-4 py-2 rounded-lg bg-rose-600 hover:bg-rose-500 text-white font-bold"
                onclick="historyCtrl.executeClearHistory()">
          Yes, Clear All
        </button>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/config.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/theme.js"></script>
  <script src="../js/common.js"></script>
  <script src="../js/history.js"></script>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      historyCtrl.init();
    });
  </script>
</body>
</html>
