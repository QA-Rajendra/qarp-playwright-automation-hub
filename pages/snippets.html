<!DOCTYPE html>
<html lang="en" data-theme="default">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JS Snippets - QARP Playwright Hub</title>
  <meta name="description" content="Ready-to-use Playwright JavaScript test snippets: login, API, POM, hooks, assertions and more.">
  <link rel="icon" type="image/svg+xml" href="../assets/img/favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/custom.css">
  <style>
    :root {
      --bg: #090d13;
      --card: #131722;
      --code: #0b0f17;
      --bdr: #232b3b;
      --muted: #94a3b8;
      --text: #f1f5f9;
      --pur: #a78bfa;
      --cyn: #38bdf8;
      --grn: #34d399;
      --red: #f87171;
      --amb: #fbbf24;
    }

    [data-theme="blue"],
    [data-theme="blue-erp"] {
      --bg: #F5F9FF;
      --card: #FFFFFF;
      --code: #07192C;
      --bdr: #D9E5F2;
      --muted: #64748B;
      --text: #172B4D;
      --pur: #1976D2;
      --cyn: #0284C7;
      --grn: #16A34A;
      --red: #DC2626;
      --amb: #D97706;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'JetBrains Mono', monospace; min-height: 100vh; overflow-x: hidden; transition: background 0.3s, color 0.3s; }
    
    .wrap { position: relative; z-index: 1; }
    .topbar { background: rgba(13, 17, 24, 0.95); border-bottom: 1px solid var(--bdr); backdrop-filter: blur(16px); position: sticky; top: 0; z-index: 100; transition: background 0.3s; }
    .catbar { border-bottom: 1px solid var(--bdr); background: rgba(18, 23, 34, 0.85); backdrop-filter: blur(8px); position: sticky; top: 57px; z-index: 50; transition: background 0.3s; }
    .srch { background: rgba(13, 17, 24, 0.9); border: 1px solid var(--bdr); color: var(--text); font-family: inherit; border-radius: 0.5rem; padding: 0.5rem 1rem 0.5rem 2.25rem; font-size: 0.75rem; width: 260px; outline: none; transition: all 0.2s; }
    .srch:focus { border-color: var(--pur); box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.15); }
    .srch::placeholder { color: var(--muted); }
    .tabs { display: flex; gap: 0.375rem; flex-wrap: wrap; }
    .tab { padding: 0.35rem 0.875rem; border-radius: 9999px; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; border: 1px solid var(--bdr); background: var(--card); color: var(--muted); cursor: pointer; transition: all 0.18s; white-space: nowrap; font-family: inherit; }
    .tab:hover { border-color: var(--pur); color: var(--text); }
    .tab.on { background: linear-gradient(135deg, var(--pur), var(--cyn)); border-color: transparent; color: #fff; box-shadow: 0 4px 12px rgba(25, 118, 210, 0.35); }
    .sgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(520px, 1fr)); gap: 1.25rem; }
    @media (max-width: 640px) { .sgrid { grid-template-columns: 1fr; } .srch { width: 100%; } }
    .scard { background: var(--card); border: 1px solid var(--bdr); border-radius: 0.875rem; overflow: hidden; transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s; display: flex; flex-direction: column; }
    .scard:hover { border-color: var(--pur); transform: translateY(-2px); box-shadow: 0 12px 30px rgba(0,0,0,0.15); }
    .sch { padding: 0.875rem 1rem; border-bottom: 1px solid var(--bdr); display: flex; align-items: center; justify-content: space-between; background: rgba(0, 0, 0, 0.05); }
    .stitle { font-size: 0.78rem; font-weight: 700; display: flex; align-items: center; gap: 0.5rem; color: var(--text); }
    .sbadge { font-size: 0.6rem; padding: 0.15rem 0.5rem; border-radius: 9999px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
    .cpbtn { display: flex; align-items: center; gap: 0.35rem; padding: 0.3rem 0.75rem; border-radius: 0.375rem; font-size: 0.65rem; font-weight: 700; border: 1px solid var(--bdr); background: rgba(0, 0, 0, 0.08); color: var(--muted); cursor: pointer; transition: all 0.18s; font-family: inherit; }
    .cpbtn:hover { border-color: var(--cyn); color: var(--cyn); }
    .cpbtn.done { border-color: var(--grn); color: var(--grn); }
    .scb { background: var(--code); padding: 1rem 1.125rem; font-size: 0.72rem; line-height: 1.8; overflow-x: auto; flex: 1; max-height: 340px; overflow-y: auto; }
    .scb::-webkit-scrollbar { width: 5px; height: 5px; }
    .scb::-webkit-scrollbar-thumb { background: #232b3b; border-radius: 9999px; }
    pre code { color: #e2e8f0; white-space: pre; display: block; font-family: 'JetBrains Mono', monospace; }
    
    /* Code Highlighting Syntax Tokens */
    .cm { color: #8b949e; font-style: italic; }
    .st { color: #86efac; }
    .kw { color: #c4b5fd; font-weight: 600; }
    .fn { color: #93c5fd; }
    .nm { color: #fde047; }
    
    .scf { padding: 0.5rem 1rem; border-top: 1px solid var(--bdr); background: rgba(0, 0, 0, 0.04); display: flex; align-items: center; gap: 0.75rem; font-size: 0.65rem; color: var(--muted); flex-wrap: wrap; }
    .stag { padding: 0.1rem 0.45rem; border-radius: 9999px; background: rgba(0, 0, 0, 0.06); border: 1px solid var(--bdr); color: var(--muted); }
    .empty-s { text-align: center; padding: 5rem 2rem; color: var(--muted); }
    .hl { background: rgba(124, 58, 237, 0.3); border-radius: 2px; color: #c4b5fd; }
    .grad { background: linear-gradient(135deg, var(--pur), var(--cyn)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .chip { font-size: 0.65rem; padding: 0.2rem 0.6rem; border-radius: 9999px; border: 1px solid var(--bdr); color: var(--muted); }
    .lnum { display: inline-block; user-select: none; color: #475569; margin-right: 0.75rem; min-width: 1.5rem; text-align: right; }

    /* Blue Theme Specific Overrides for Snippets Page */
    [data-theme="blue"] .topbar,
    [data-theme="blue-erp"] .topbar {
      background: #00264B !important;
      border-bottom-color: rgba(217, 229, 242, 0.2) !important;
      color: #FFFFFF !important;
    }
    [data-theme="blue"] .topbar a,
    [data-theme="blue"] .topbar span,
    [data-theme="blue-erp"] .topbar a,
    [data-theme="blue-erp"] .topbar span {
      color: #D9E5F2 !important;
    }
    [data-theme="blue"] .catbar,
    [data-theme="blue-erp"] .catbar {
      background: #FFFFFF !important;
      border-bottom-color: #D9E5F2 !important;
    }
    [data-theme="blue"] .scard,
    [data-theme="blue-erp"] .scard {
      background: #FFFFFF !important;
      border-color: #D9E5F2 !important;
      color: #172B4D !important;
      box-shadow: 0 2px 8px rgba(11, 45, 77, 0.06) !important;
    }
    [data-theme="blue"] .sch,
    [data-theme="blue-erp"] .sch {
      background: #F8FAFD !important;
      border-bottom-color: #D9E5F2 !important;
      color: #172B4D !important;
    }
    [data-theme="blue"] .stitle,
    [data-theme="blue-erp"] .stitle {
      color: #172B4D !important;
    }
    [data-theme="blue"] .scf,
    [data-theme="blue-erp"] .scf {
      background: #FAFCFE !important;
      border-top-color: #D9E5F2 !important;
      color: #64748B !important;
    }
    [data-theme="blue"] .stag,
    [data-theme="blue-erp"] .stag {
      background: #EDF4FC !important;
      border-color: #D9E5F2 !important;
      color: #1976D2 !important;
    }
    [data-theme="blue"] .srch,
    [data-theme="blue-erp"] .srch {
      background: #FFFFFF !important;
      border-color: #D9E5F2 !important;
      color: #172B4D !important;
    }
    [data-theme="blue"] .tab,
    [data-theme="blue-erp"] .tab {
      background: #FFFFFF !important;
      border-color: #D9E5F2 !important;
      color: #64748B !important;
    }
    [data-theme="blue"] .tab.on,
    [data-theme="blue-erp"] .tab.on {
      background: #1976D2 !important;
      color: #FFFFFF !important;
      border-color: #1976D2 !important;
    }
    [data-theme="blue"] .cpbtn,
    [data-theme="blue-erp"] .cpbtn {
      background: #EDF4FC !important;
      border-color: #D9E5F2 !important;
      color: #1976D2 !important;
    }
    [data-theme="blue"] .cpbtn:hover,
    [data-theme="blue-erp"] .cpbtn:hover {
      background: #1976D2 !important;
      color: #FFFFFF !important;
    }
  </style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="max-w-7xl mx-auto px-5 py-3 flex items-center justify-between gap-4 flex-wrap">
      <div class="flex items-center gap-4">
        <a href="../index.html" class="text-slate-400 hover:text-purple-300 transition-colors text-xs">&#8592; Hub</a>
        <div class="w-px h-5 bg-slate-800"></div>
        <h1 class="text-sm font-bold grad tracking-tight">&#127921; Playwright JS Snippets</h1>
        <span class="text-[9px] text-slate-500 uppercase tracking-widest hidden sm:block">Ready-to-use code</span>
      </div>
      <div class="flex items-center gap-3">
        <span id="chip" class="chip">Loading&#8230;</span>
        <div class="relative">
          <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-slate-500 text-xs">&#128269;</span>
          <input type="text" id="si" class="srch" placeholder="Search snippets&#8230; (press /)" oninput="flt()">
        </div>
        <!-- Theme Toggle -->
        <div class="relative">
          <button type="button" class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border border-slate-700 bg-slate-800 text-slate-300 text-[11px] font-mono hover:border-slate-500 transition-all cursor-pointer"
                  id="themeBtn" onclick="theme.toggleThemeMenu(event)" title="Switch Theme">
            <span id="themeIco">🌙</span>
            <span id="themeLbl">DEFAULT</span>
          </button>
          <div class="hidden absolute top-full right-0 mt-2 w-44 p-2 rounded-xl bg-slate-900 border border-slate-700 shadow-2xl z-50 flex flex-col gap-1 text-[11px]" id="themeMenu">
            <button type="button" class="theme-opt flex items-center justify-between px-2.5 py-2 rounded-lg text-slate-300 hover:bg-slate-800 text-left transition-all"
                    data-theme="default" onclick="changeTheme('default'); theme.toggleThemeMenu(event);">
              <span class="flex items-center gap-2"><span>🌙</span> <b>Default</b></span>
              <span class="theme-check font-bold text-xs text-purple-400"></span>
            </button>
            <button type="button" class="theme-opt flex items-center justify-between px-2.5 py-2 rounded-lg text-slate-300 hover:bg-slate-800 text-left transition-all"
                    data-theme="blue" onclick="changeTheme('blue'); theme.toggleThemeMenu(event);">
              <span class="flex items-center gap-2"><span>🔷</span> <b>Blue</b></span>
              <span class="theme-check font-bold text-xs text-blue-400"></span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="catbar">
    <div class="max-w-7xl mx-auto px-5 py-2.5">
      <div class="tabs" id="tabs"></div>
    </div>
  </div>
  <div class="max-w-7xl mx-auto px-5 py-6">
    <div class="sgrid" id="grid"></div>
    <div class="empty-s hidden" id="empty">
      <p class="text-sm font-bold text-slate-500 mt-2">No snippets found</p>
      <p class="text-xs text-slate-600 mt-1">Try a different search or category</p>
    </div>
  </div>
</div>
<script>
var S=[
{id:'s1',cat:'Setup',icon:'&#9881;',title:'Project Setup & Install',badge:'terminal',bc:'#3b82f6',tags:['npm','install','init'],
code:'# Bootstrap new project\nmkdir myproject\ncd myproject\nnpm init -y\nnpm install -D @playwright/test\nnpx playwright install\nnpx playwright init'},
{id:'s2',cat:'Setup',icon:'&#9881;',title:'playwright.config.js',badge:'config',bc:'#7c3aed',tags:['config','browsers','projects'],
code:"// playwright.config.js\nconst { defineConfig, devices } = require('@playwright/test');\nmodule.exports = defineConfig({\n  testDir: './tests',\n  timeout: 30000,\n  retries: 1,\n  workers: 4,\n  reporter: [['html'], ['list']],\n  use: {\n    baseURL: 'https://www.saucedemo.com',\n    headless: true,\n    screenshot: 'only-on-failure',\n    video: 'retain-on-failure',\n    trace: 'on-first-retry',\n  },\n  projects: [\n    { name: 'chromium', use: { ...devices['Desktop Chrome'] } },\n    { name: 'firefox',  use: { ...devices['Desktop Firefox'] } },\n    { name: 'webkit',   use: { ...devices['Desktop Safari'] } },\n    { name: 'mobile',   use: { ...devices['iPhone 13'] } },\n  ],\n});"},
{id:'b1',cat:'Basics',icon:'&#128640;',title:'First Test - Navigate & Assert',badge:'beginner',bc:'#3fb950',tags:['navigate','expect','title'],
code:"const { test, expect } = require('@playwright/test');\n\ntest('homepage title', async ({ page }) => {\n  await page.goto('https://playwright.dev');\n  await expect(page).toHaveTitle(/Playwright/);\n  await expect(page).toHaveURL('https://playwright.dev/');\n});"},
{id:'b2',cat:'Basics',icon:'&#128640;',title:'Click, Fill & Submit Form',badge:'beginner',bc:'#3fb950',tags:['click','fill','locator'],
code:"const { test, expect } = require('@playwright/test');\n\ntest('login form', async ({ page }) => {\n  await page.goto('/login');\n  await page.fill('#username', 'standard_user');\n  await page.fill('#password', 'secret_sauce');\n  // Preferred: use locators\n  await page.locator('[data-test=\"login-button\"]').click();\n  await expect(page).toHaveURL('/inventory.html');\n  await expect(page.locator('.title')).toHaveText('Products');\n});"},
{id:'b3',cat:'Basics',icon:'&#128640;',title:'Locator Strategies',badge:'beginner',bc:'#3fb950',tags:['getByRole','getByText','css','xpath'],
code:"const { test } = require('@playwright/test');\n\ntest('locators', async ({ page }) => {\n  // By role (most accessible - preferred)\n  await page.getByRole('button', { name: 'Sign in' }).click();\n  await page.getByRole('textbox', { name: 'Email' }).fill('a@b.com');\n  // By label\n  await page.getByLabel('Password').fill('secret');\n  // By placeholder\n  await page.getByPlaceholder('Search...').fill('query');\n  // By text\n  await page.getByText('Welcome back').isVisible();\n  // By testId (data-testid)\n  await page.getByTestId('submit').click();\n  // CSS\n  await page.locator('button.submit').click();\n  // XPath\n  await page.locator('//button[text()=\"Submit\"]').click();\n});"},
{id:'a1',cat:'Assertions',icon:'&#9989;',title:'Web-First Assertions',badge:'core',bc:'#06b6d4',tags:['expect','toHaveText','toBeVisible','toHaveCount'],
code:"const { test, expect } = require('@playwright/test');\n\ntest('assertions', async ({ page }) => {\n  await page.goto('/inventory.html');\n  // Visibility\n  await expect(page.locator('.title')).toBeVisible();\n  await expect(page.locator('.hidden')).toBeHidden();\n  // Text\n  await expect(page.locator('h1')).toHaveText('Products');\n  await expect(page.locator('h1')).toContainText('Prod');\n  // Input value\n  await expect(page.locator('#qty')).toHaveValue('1');\n  // Attribute\n  await expect(page.locator('img')).toHaveAttribute('alt', 'logo');\n  // CSS class\n  await expect(page.locator('.btn')).toHaveClass(/active/);\n  // Count\n  await expect(page.locator('.item')).toHaveCount(6);\n  // URL and title\n  await expect(page).toHaveURL(/inventory/);\n  await expect(page).toHaveTitle(/Swag Labs/);\n  // State\n  await expect(page.locator('#submit')).toBeEnabled();\n  await expect(page.locator('#agree')).toBeChecked();\n});"},
{id:'a2',cat:'Assertions',icon:'&#9989;',title:'Soft Assertions',badge:'advanced',bc:'#f59e0b',tags:['expect.soft','non-blocking'],
code:"const { test, expect } = require('@playwright/test');\n\ntest('soft assertions', async ({ page }) => {\n  await page.goto('/checkout');\n  // Soft: collect failures without stopping test\n  await expect.soft(page.locator('h1')).toHaveText('Checkout');\n  await expect.soft(page.locator('.total')).toContainText('$');\n  await expect.soft(page.locator('#finish')).toBeEnabled();\n  // Hard: stops test immediately on failure\n  await expect(page.locator('.order-id')).toBeVisible();\n  // All soft failures are reported at the end\n});"},
{id:'p1',cat:'POM',icon:'&#127959;',title:'Page Object - Login Page',badge:'pattern',bc:'#ec4899',tags:['POM','class','reusable'],
code:"// pages/LoginPage.js\nclass LoginPage {\n  constructor(page) {\n    this.page = page;\n    this.usernameInput = page.locator('#user-name');\n    this.passwordInput = page.locator('#password');\n    this.loginButton   = page.locator('#login-button');\n    this.errorMessage  = page.locator('[data-test=\"error\"]');\n  }\n\n  async navigate() {\n    await this.page.goto('/');\n  }\n\n  async login(username, password) {\n    await this.usernameInput.fill(username);\n    await this.passwordInput.fill(password);\n    await this.loginButton.click();\n  }\n\n  async getErrorMessage() {\n    return await this.errorMessage.textContent();\n  }\n}\n\nmodule.exports = { LoginPage };"},
{id:'p2',cat:'POM',icon:'&#127959;',title:'POM - Usage in Spec',badge:'pattern',bc:'#ec4899',tags:['import','describe','beforeEach'],
code:"const { test, expect } = require('@playwright/test');\nconst { LoginPage }    = require('../pages/LoginPage');\n\ntest.describe('Login Tests', () => {\n  let loginPage;\n\n  test.beforeEach(async ({ page }) => {\n    loginPage = new LoginPage(page);\n    await loginPage.navigate();\n  });\n\n  test('valid login redirects', async ({ page }) => {\n    await loginPage.login('standard_user', 'secret_sauce');\n    await expect(page).toHaveURL('/inventory.html');\n  });\n\n  test('invalid login shows error', async () => {\n    await loginPage.login('bad_user', 'bad_pass');\n    const err = await loginPage.getErrorMessage();\n    expect(err).toContain('Username and password do not match');\n  });\n});"},
{id:'p3',cat:'POM',icon:'&#127959;',title:'BasePage + Inheritance',badge:'advanced',bc:'#f59e0b',tags:['base','extends','inherit'],
code:"// pages/BasePage.js\nclass BasePage {\n  constructor(page) { this.page = page; }\n  async navigate(path) { await this.page.goto(path || '/'); }\n  async waitForLoad()  { await this.page.waitForLoadState('networkidle'); }\n  async getTitle()     { return await this.page.title(); }\n}\n\n// pages/ProductsPage.js\nconst { BasePage } = require('./BasePage');\n\nclass ProductsPage extends BasePage {\n  constructor(page) {\n    super(page);\n    this.addBtn    = page.locator('[data-test^=\"add-to-cart\"]');\n    this.cartBadge = page.locator('.shopping_cart_badge');\n  }\n  async addFirstItem()  { await this.addBtn.first().click(); }\n  async getCartCount()  { return await this.cartBadge.textContent(); }\n}\nmodule.exports = { ProductsPage };"},
{id:'h1',cat:'Hooks',icon:'&#128279;',title:'beforeEach / afterEach',badge:'lifecycle',bc:'#06b6d4',tags:['beforeAll','afterAll','setup','teardown'],
code:"const { test, expect } = require('@playwright/test');\n\ntest.describe('Shopping Cart', () => {\n  test.beforeAll(async () => {\n    console.log('Suite starting...');\n  });\n\n  test.afterAll(async () => {\n    console.log('Suite done.');\n  });\n\n  test.beforeEach(async ({ page }) => {\n    await page.goto('/');\n    await page.fill('#user-name', 'standard_user');\n    await page.fill('#password', 'secret_sauce');\n    await page.click('#login-button');\n    await page.waitForURL('/inventory.html');\n  });\n\n  test.afterEach(async ({ page }, testInfo) => {\n    if (testInfo.status !== 'passed') {\n      await page.screenshot({ path: 'fail-' + testInfo.title + '.png' });\n    }\n  });\n\n  test('add item to cart', async ({ page }) => {\n    await page.click('[data-test=\"add-to-cart-sauce-labs-backpack\"]');\n    await expect(page.locator('.shopping_cart_badge')).toHaveText('1');\n  });\n});"},
{id:'h2',cat:'Hooks',icon:'&#128279;',title:'Custom Fixtures',badge:'advanced',bc:'#f59e0b',tags:['fixture','test.extend'],
code:"// fixtures/baseFixture.js\nconst { test: base } = require('@playwright/test');\nconst { LoginPage }  = require('../pages/LoginPage');\n\nconst test = base.extend({\n  loggedInPage: async ({ page }, use) => {\n    const login = new LoginPage(page);\n    await login.navigate();\n    await login.login('standard_user', 'secret_sauce');\n    await page.waitForURL('/inventory.html');\n    await use(page);   // hands page to the test\n    // teardown can go here\n  },\n});\n\nmodule.exports = { test };\n\n// Usage:\n// const { test } = require('../fixtures/baseFixture');\n// test('works', async ({ loggedInPage }) => { ... });"},
{id:'api1',cat:'API Testing',icon:'&#127760;',title:'GET & POST Requests',badge:'api',bc:'#06b6d4',tags:['request','GET','POST','JSON'],
code:"const { test, expect } = require('@playwright/test');\n\ntest('GET /users', async ({ request }) => {\n  const res = await request.get('https://reqres.in/api/users?page=1');\n  expect(res.status()).toBe(200);\n  const body = await res.json();\n  expect(body.data[0]).toHaveProperty('email');\n});\n\ntest('POST /users', async ({ request }) => {\n  const res = await request.post('https://reqres.in/api/users', {\n    data: { name: 'John Doe', job: 'QA Engineer' }\n  });\n  expect(res.status()).toBe(201);\n  const body = await res.json();\n  expect(body.name).toBe('John Doe');\n});\n\ntest('DELETE /users/2', async ({ request }) => {\n  const res = await request.delete('https://reqres.in/api/users/2');\n  expect(res.status()).toBe(204);\n});"},
{id:'api2',cat:'API Testing',icon:'&#127760;',title:'Auth Token + API Context',badge:'api',bc:'#06b6d4',tags:['bearer','token','headers'],

var CATS=['All'];
S.forEach(function(s){ if(CATS.indexOf(s.cat)===-1) CATS.push(s.cat); });
var activeCat='All', q='';

function buildTabs(){
  document.getElementById('tabs').innerHTML=CATS.map(function(c){
    return '<button class="tab'+(c==='All'?' on':'')+'" onclick="selCat(\''+c+'\')" data-c="'+c+'">'+c+'</button>';
  }).join('');
}
function selCat(c){
  activeCat=c;
  document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('on',b.dataset.c===c); });
  render();
}
function flt(){ q=document.getElementById('si').value.toLowerCase().trim(); render(); }
function matches(s){
  var cm=activeCat==='All'||s.cat===activeCat;
  if(!q) return cm;
  var h=[s.title,s.cat].concat(s.tags).concat([s.code]).join(' ').toLowerCase();
  return cm&&h.indexOf(q)!==-1;
}
function escH(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function hlText(t){
  if(!q) return escH(t);
  var re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return escH(t).replace(re,'<span class="hl">$1</span>');
}
function synHL(code){
  var isBash = /^(#|npx|npm|mkdir|cd)/.test(code.trim());
  if (isBash) {
    return code.replace(/(#[^\n]*)|(\b(?:npx|npm|mkdir|cd|node|export)\b)/g, function(m, c, k){
      if (c) return '<span class="cm">' + escH(c) + '</span>';
      if (k) return '<span class="kw">' + escH(k) + '</span>';
      return escH(m);
    });
  }
  // Single-pass tokenizer for JS tokens to prevent nested HTML corruption
  var re = /(\/\/[^\n]*)|('(?:\\.|[^'\\])*'|"(?:\\.|[^"\\])*"|`(?:\\.|[^`\\])*`)|(\b(?:const|let|var|function|class|return|async|await|import|export|require|module|new|this|if|else|for|of|in|true|false|null|undefined|from)\b)|(\b(?:test|expect|describe|beforeEach|afterEach|beforeAll|afterAll|page|request|context|route)\b)|(\b\d+\b)/g;
  var lastIdx = 0, result = '';
  var match;
  while ((match = re.exec(code)) !== null) {
    result += escH(code.slice(lastIdx, match.index));
    var comment = match[1], str = match[2], kw = match[3], fn = match[4], num = match[5];
    if (comment) result += '<span class="cm">' + escH(comment) + '</span>';
    else if (str) result += '<span class="st">' + escH(str) + '</span>';
    else if (kw) result += '<span class="kw">' + escH(kw) + '</span>';
    else if (fn) result += '<span class="fn">' + escH(fn) + '</span>';
    else if (num) result += '<span class="nm">' + escH(num) + '</span>';
    lastIdx = re.lastIndex;
  }
  result += escH(code.slice(lastIdx));
  return result;
}
function withLN(code){
  return code.split('\n').map(function(l,i){
    return '<span class="lnum">'+(i+1)+'</span>'+l;
  }).join('\n');
}
function render(){
  var vis=S.filter(matches);
  document.getElementById('chip').textContent=vis.length+' of '+S.length+' snippets';
  var empty=document.getElementById('empty'),grid=document.getElementById('grid');
  if(!vis.length){ grid.innerHTML=''; empty.classList.remove('hidden'); return; }
  empty.classList.add('hidden');
  grid.innerHTML=vis.map(function(s){
    return '<div class="scard">'+
      '<div class="sch">'+
        '<div class="stitle">'+
          '<span>'+s.icon+'</span>'+
          '<span>'+hlText(s.title)+'</span>'+
          '<span class="sbadge" style="background:'+s.bc+'22;color:'+s.bc+';border:1px solid '+s.bc+'44">'+s.badge+'</span>'+
        '</div>'+
        '<button class="cpbtn" onclick="cp(\''+s.id+'\')" id="cb-'+s.id+'">&#8998; Copy</button>'+
      '</div>'+
      '<div class="scb"><pre><code>'+withLN(synHL(s.code))+'</code></pre></div>'+
      '<div class="scf">'+
        '<span>&#128194; '+s.cat+'</span><span>&#183;</span>'+
        '<span>'+s.code.split('\n').length+' lines</span><span>&#183;</span>'+
        s.tags.map(function(t){ return '<span class="stag">'+t+'</span>'; }).join('')+
      '</div>'+
    '</div>';
  }).join('');
}
function cp(id){
  var s=S.filter(function(x){ return x.id===id; })[0];
  if(!s) return;
  var btn=document.getElementById('cb-'+id);
  try{
    navigator.clipboard.writeText(s.code).then(function(){
      btn.textContent='\u2713 Copied!'; btn.classList.add('done');
      setTimeout(function(){ btn.innerHTML='&#8998; Copy'; btn.classList.remove('done'); },1800);
    });
  }catch(_){
    var ta=document.createElement('textarea');
    ta.value=s.code; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
    btn.textContent='\u2713 Copied!'; btn.classList.add('done');
    setTimeout(function(){ btn.innerHTML='&#8998; Copy'; btn.classList.remove('done'); },1800);
  }
}
window.addEventListener('DOMContentLoaded',function(){
  buildTabs(); render();
  document.addEventListener('keydown',function(e){
    if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){ e.preventDefault(); document.getElementById('si').focus(); }
    if(e.key==='Escape'){ document.getElementById('si').value=''; q=''; render(); }
  });
});
</script>
